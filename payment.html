<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/payment.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./images/Logo.png" alt="">
          </div>
          <div class="profile">
            <img src="./images/heart.png" alt="">
            <img src="./images/notification.png" alt="">
            <img src="./images/setting-2.png" alt="">
        </div>
        <div class="pro-img">
        <img src="./images/Image-profile.png" alt="">
      </div>
    </header>
    <main>
      <div class="billing-info">
        <div class="billing-card">
          <div class="detail-container">
          <div class="info">
            <h3>Billing Info</h3>
            <p>Please enter your billing info</p>
            <div class="info-1">
              <p>Step 1 of 4</p>
            </div>
          </div>
            <div class="personal-info">
              <div class="name">
                <p>Name</p>
                <input type="text" placeholder="Your name" required>
              </div>
              <div class="name">
                <p>Phone Number</p>
                <input type="text" placeholder="Phone number" required>
              </div>
            </div>
            <div class="personal-info-11">
              <div class="name">
                <p>Address</p>
                <input type="text" placeholder="Address" required>
              </div>
              <div class="name">
                <p>Town/City</p>
                <input type="text" placeholder="Town or city" required>
              </div>
            </div>
          </div>
          <!-- rental info card -->
          <div class="detail-container-2">
            <div class="info">
              <h3>Rental Info</h3>
              <p>Please enter your rental date</p>
              <div class="info-1">
                <p>Step 2 of 4</p>
              </div>
            </div>
            <p>Pick-Up</p>
             <div class="personal-info-33">
              <div class="name">
                <p>Location</p>
               <select name="text" class="locate">
                <option value="text">Select your city</option>
               </select>
              </div>
              <div class="name">
                <p>Date</p>
               <select name="text" class="locate">
                <option value="text">Select your date</option>
               </select>
              </div>
              <div class="name">
                <p>Time</p>
               <select name="text" class="locate">
                <option value="text">Select your time</option>
               </select>
              </div>
             </div>
             <!-- drop off -->
             <div class="personal-info-44">
              <p>Drop-Off</p>
              <div class="name">
                <p>Location</p>
               <select name="text" class="locate">
                <option value="text">Select your city</option>
               </select>
              </div>
              <div class="name">
                <p>Date</p>
               <select name="text" class="locate">
                <option value="text">Select your date</option>
               </select>
              </div>
              <div class="name">
                <p>Time</p>
               <select name="text" class="locate">
                <option value="text">Select your time</option>
               </select>
              </div>
             </div>
          
             
            

          </div>
        </div>
        <div class="rental-summary"></div>
      </div>
    </main>
</body>
</html>
